# This rule is not used by the project clustersentinel itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over security.clustersentinel.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clustersentinel
    app.kubernetes.io/managed-by: kustomize
  name: securitypolicy-admin-role
rules:
- apiGroups:
  - security.clustersentinel.io
  resources:
  - securitypolicies
  verbs:
  - '*'
- apiGroups:
  - security.clustersentinel.io
  resources:
  - securitypolicies/status
  verbs:
  - get
