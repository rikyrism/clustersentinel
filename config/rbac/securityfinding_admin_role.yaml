# This rule is not used by the project clustersentinel itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants every verb over this resource, listed explicitly rather than with '*' so that
# verbs added to Kubernetes later are not granted implicitly (see rule CS-RBAC-001).
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clustersentinel
    app.kubernetes.io/managed-by: kustomize
  name: securityfinding-admin-role
rules:
- apiGroups:
  - security.clustersentinel.io
  resources:
  - securityfindings
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - security.clustersentinel.io
  resources:
  - securityfindings/status
  verbs:
  - get
