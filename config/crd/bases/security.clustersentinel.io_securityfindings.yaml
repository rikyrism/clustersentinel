---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: securityfindings.security.clustersentinel.io
spec:
  group: security.clustersentinel.io
  names:
    categories:
    - clustersentinel
    kind: SecurityFinding
    listKind: SecurityFindingList
    plural: securityfindings
    shortNames:
    - secf
    - sfinding
    singular: securityfinding
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.severity
      name: Severity
      type: string
    - jsonPath: .spec.ruleID
      name: Rule
      type: string
    - jsonPath: .spec.resource.kind
      name: Kind
      type: string
    - jsonPath: .spec.resource.name
      name: Resource
      type: string
    - jsonPath: .spec.resource.container
      name: Container
      priority: 1
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.lastDetectedAt
      name: Last Seen
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SecurityFinding records one insecure configuration detected by
          ClusterSentinel.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec describes the finding
            properties:
              description:
                description: description explains what was detected.
                type: string
              documentationURL:
                description: documentationURL links to the rule's documentation.
                type: string
              evidence:
                description: |-
                  evidence is the offending configuration path and value, e.g.
                  "spec.template.spec.containers[worker].securityContext.privileged=true".
                  It never contains Secret data or environment variable values.
                type: string
              recommendation:
                description: recommendation describes how to address the finding.
                type: string
              resource:
                description: resource identifies the affected object.
                properties:
                  apiVersion:
                    description: apiVersion of the affected object, e.g. apps/v1.
                    minLength: 1
                    type: string
                  container:
                    description: container is the affected container, for container-level
                      rules.
                    type: string
                  kind:
                    description: kind of the affected object, e.g. Deployment.
                    minLength: 1
                    type: string
                  name:
                    description: name of the affected object.
                    minLength: 1
                    type: string
                  namespace:
                    description: namespace of the affected object; empty for cluster-scoped
                      objects.
                    type: string
                  uid:
                    description: uid of the affected object. A recreated object has
                      a new UID and gets new findings.
                    minLength: 1
                    type: string
                required:
                - apiVersion
                - kind
                - name
                - uid
                type: object
              ruleID:
                description: ruleID is the stable identifier of the rule, e.g. CS-CONTAINER-001.
                pattern: ^CS-[A-Z]+-[0-9]{3}$
                type: string
              ruleVersion:
                description: ruleVersion increases when the rule's detection logic
                  changes meaningfully.
                format: int32
                minimum: 1
                type: integer
              severity:
                description: severity is the effective severity after policy overrides.
                enum:
                - CRITICAL
                - HIGH
                - MEDIUM
                - LOW
                - INFO
                type: string
              title:
                description: title is a short human-readable summary.
                minLength: 1
                type: string
            required:
            - resource
            - ruleID
            - ruleVersion
            - severity
            - title
            type: object
          status:
            description: status tracks the finding's lifecycle
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              firstDetectedAt:
                description: firstDetectedAt is when the issue was first seen on this
                  resource.
                format: date-time
                type: string
              lastDetectedAt:
                description: |-
                  lastDetectedAt is when a scan last confirmed the issue. It is refreshed at most
                  once per rescan interval to limit API writes.
                format: date-time
                type: string
              notifiedSeverity:
                description: |-
                  notifiedSeverity is the severity last announced to notification channels.
                  It makes notification deduplication survive operator restarts.
                enum:
                - CRITICAL
                - HIGH
                - MEDIUM
                - LOW
                - INFO
                type: string
              notifiedState:
                description: notifiedState is the state last announced to notification
                  channels.
                enum:
                - Open
                - Resolved
                type: string
              resolvedAt:
                description: resolvedAt is when the issue was no longer detected.
                format: date-time
                type: string
              state:
                description: state is Open while the issue is present and Resolved
                  after it disappears.
                enum:
                - Open
                - Resolved
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
