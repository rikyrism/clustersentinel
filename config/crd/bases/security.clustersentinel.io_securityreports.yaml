    - clustersentinel
    kind: SecurityReport
    listKind: SecurityReportList
    plural: securityreports
    shortNames:
    - secr
    - sreport
    singular: securityreport
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.openFindings
      name: Open
      type: integer
    - jsonPath: .status.bySeverity.critical
      name: Critical
      type: integer
    - jsonPath: .status.bySeverity.high
      name: High
      type: integer
    - jsonPath: .status.lastScanTime
      name: Last Scan
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SecurityReport summarizes ClusterSentinel's findings for the whole cluster. There is one,
          named "cluster", in the operator's namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is empty; the report is maintained by the operator
            type: object
          status:
            description: status holds the summary
            properties:
              bySeverity:
                description: bySeverity counts open findings per severity.
                properties:
                  critical:
                    format: int32
                    type: integer
                  high:
                    format: int32
                    type: integer
                  info:
                    format: int32
                    type: integer
                  low:
                    format: int32
                    type: integer
                  medium:
